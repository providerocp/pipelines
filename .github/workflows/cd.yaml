name: Build and Deploy Application

on:
  workflow_call:
    inputs:
      repository:
        description: "Nome do repositório"
        required: true
        type: string  
      environment:
        description: "Ambiente de deploy"
        required: true
        type: string
      current_pr_number:
        description: "ID do PR atual"
        required: false
        type: number   
        default: 0        
    secrets:
      ENTERPRISE_GITHUB_TOKEN:
        required: true
      GH_TOKEN:
        required: false


jobs:
  remove-labels:
    runs-on: ${{ inputs.os_version }}
    if: contains(github.event.label.name, 'deploy development') || ${{ inputs.current_pr_number == 0 }}

    steps:
      - name: Remover labels "deploy development" de outros PRs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CURRENT_PR_NUMBER: ${{ github.event.number }}
        run: |
          # Define o repositório atual
          repo="${{ github.repository }}"

          echo "Verificando PRs abertas para o repositório: $repo"
          
          # Obtem todas as PRs abertas com seus labels
          response=$(curl -s -H "Authorization: token $GITHUB_TOKEN" \
                            -H "Accept: application/vnd.github.v3+json" \
                            "https://api.github.com/repos/$repo/pulls?state=open")
          
          # Filtra PRs que possuem a label "deploy development" e que não são o PR atual
          echo "$response" | jq -r --arg CURRENT_PR_NUMBER "${{ inputs.current_pr_number }}" '
              .[] | select(.number != (${{ inputs.current_pr_number }} | tonumber)) |
              select(.labels[].name == "deploy development") | .number
          ' | while read -r pr_number; do
              echo "Removendo label 'deploy development' do PR #$pr_number no repositório $repo"

              # Remove a label "deploy development" do PR
              curl -s -X DELETE -H "Authorization: token $GITHUB_TOKEN" \
                  -H "Accept: application/vnd.github.v3+json" \
                  "https://api.github.com/repos/$repo/issues/$pr_number/labels/deploy%20development"
              
              echo "Label removida com sucesso para o PR #$pr_number"
          done

  build:
    runs-on: [ubuntu-latest]
    outputs:
      image-tag: ${{ steps.gitversion.outputs.SemVer }}

    steps:
      - name: Capitalização env repository
        run: |
          repository_lower="${{ inputs.repository }}"
          #repository_upper=$(echo "$repository_lower" | tr '[:lower:]' '[:upper:]')

          #echo "Valor em maiúsculas: $repository_upper"      
          echo "repository_upper=`echo ${repository_lower^} `" >> $GITHUB_ENV    

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v0.10.2
        with:
          versionSpec: "5.x"

      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Determine Version
        id: gitversion
        uses: gittools/actions/gitversion/execute@v0.10.2
        with:
          useConfigFile: true
          configFilePath: ./GitVersion.yml

      - name: Version
        run: |
          echo Building ${{ steps.gitversion.outputs.SemVer }}
          echo "::set-output name=image-tag::${{ steps.gitversion.outputs.SemVer }}"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Container Image
        run: |
          docker build -f src/BM.$repository_upper.Host/Dockerfile \
          -t ghcr.io/pipabingomaker/${{ inputs.repository }}:${{ steps.gitversion.outputs.SemVer }} \
          --build-arg PACKAGE_VERSION=${{ steps.gitversion.outputs.SemVer }} \
          --build-arg GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }} \
          --build-arg ENTERPRISE_GITHUB_TOKEN=${{ secrets.ENTERPRISE_GITHUB_TOKEN }} \
          --build-arg ASSEMBLY_VERSION=${{ steps.gitversion.outputs.AssemblySemVer }} \
          --build-arg INFORMATIONAL_VERSION=${{ steps.gitversion.outputs.InformationalVersion }} .          
          docker push ghcr.io/pipabingomaker/${{ inputs.repository }}:${{ steps.gitversion.outputs.SemVer }}          

      - name: Create Release
        uses: actions/github-script@v6
        with:
          script: |
            github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: '${{ steps.gitversion.outputs.SemVer }}',              
              name: 'Release ${{ steps.gitversion.outputs.SemVer }}',
              draft: false,
              prerelease: false,
              generate_release_notes: true
            })

  deploy-gitops:
    runs-on: ubuntu-latest
    outputs:
      image-tag: $${{ steps.set_var.outputs.image-tag }}
    permissions:
      contents: 'read'
      id-token: 'write'
    needs: [build]

    steps:
      - uses: actions/checkout@v2

      - name: Clone GitOps repository
        run: |
          git clone https://${{ secrets.ENTERPRISE_GITHUB_TOKEN }}@github.com/providerocp/gitops-apps.git

      - name: Update image tag
        run: |
          if [ -d "gitops-apps" ]; then
            cd gitops-apps
            sed -i "s#\(${{ inputs.repository }}:\).*#\1${{ needs.build.outputs.image-tag }}#" apps/overlay/${{ inputs.environment }}/bm-${{ inputs.repository }}/app.yaml
          else
            echo "Diretório gitops-apps não existe, não foi possível atualizar a imagem."
            exit 1
          fi

      - name: Configure Git
        run: |
          if [ -d "gitops-apps" ]; then
            cd gitops-apps
            git config --global user.name 'github-actions[bot]'
            git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          else
            echo "Diretório gitops-apps não existe, não foi possível configurar o git."
            exit 1
          fi        

      - name: Commit changes
        run: |
          if [ -d "gitops-apps" ]; then
            cd gitops-apps
            git add apps/overlay/${{ inputs.environment }}/bm-${{ inputs.repository }}/app.yaml
            git commit -m "Update image tag to ${{ needs.build.outputs.image-tag }} - MS: bm-${{ inputs.repository }} Dev"
          else
            echo "Diretório gitops-apps não existe, não foi possível fazer o commit."
            exit 1
          fi          

      - name: Push/Deploy changes
        run: |
          if [ -d "gitops-apps" ]; then
            cd gitops-apps
            git push
            sleep 5
          else
            echo "Diretório gitops-apps não existe, não foi possível fazer o push."
            exit 1
          fi           
