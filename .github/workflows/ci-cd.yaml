name: Consolidated CI, Build, and Deploy Application

on:
  workflow_call:
    inputs:
      repository:
        description: "Nome do repositório (ex: account, auth, etc.) - usado para nomear artefatos e encontrar manifestos."
        required: true
        type: string
      environment:
        description: "Ambiente de deploy (dev, stg, prod)"
        required: true
        type: string
      current_pr_number:
        description: "ID do PR atual (usado pelo job remove-labels, se aplicável)"
        required: false
        type: number
        default: 0
      pr_head_ref:
        description: "Nome da branch do PR (ex: feat/my-feature) - necessário para a tag simplificada."
        required: true 
        type: string
    secrets:
      GH_TOKEN: 
        required: true

jobs:
  remove-labels:
    runs-on: ubuntu-latest
    if: inputs.current_pr_number > 0 && inputs.environment == 'dev'
    steps:
      - name: Remover labels "deploy dev" de outros PRs
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
          PR_NUMBER_TO_KEEP_LABEL: ${{ inputs.current_pr_number }}
          TARGET_REPO: ${{ github.repository }} # Repositório onde o workflow está rodando
        run: |
          echo "Verificando PRs abertas para o repositório: $TARGET_REPO"
          response=$(curl -s -H "Authorization: token $GITHUB_TOKEN" \
                            -H "Accept: application/vnd.github.v3+json" \
                            "https://api.github.com/repos/$TARGET_REPO/pulls?state=open")
          echo "$response" | jq -r --arg CURRENT_PR_ARG "$PR_NUMBER_TO_KEEP_LABEL" \
              '.[] | select(.number != ($CURRENT_PR_ARG | tonumber)) | select(.labels[].name == "deploy dev") | .number' \
              | while read -r pr_number_to_clean; do
              echo "Removendo label 'deploy dev' do PR #$pr_number_to_clean no repositório $TARGET_REPO"
              curl -s -X DELETE -H "Authorization: token $GITHUB_TOKEN" \
                  -H "Accept: application/vnd.github.v3+json" \
                  "https://api.github.com/repos/$TARGET_REPO/issues/$pr_number_to_clean/labels/deploy%20dev"
              echo "Label removida com sucesso para o PR #$pr_number_to_clean"
          done

  tag_and_release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    outputs:
      simplified_image_tag: ${{ steps.construct_simplified_tag.outputs.image_tag }}
      full_release_tag: ${{ steps.final_tag.outputs.tag }}
      # Adicionando o semver base como output para o job de build, caso precise para AssemblyVersion
      semver_base: ${{ steps.tag_components.outputs.semver }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set Environment Info from Input
        id: environment_info
        run: |
          ENV_FROM_INPUT="${{ inputs.environment }}"
          if [[ ! "$ENV_FROM_INPUT" =~ ^(dev|stg|prod)$ ]]; then
            echo "::error::Input environment '$ENV_FROM_INPUT' is not valid (must be dev, stg, or prod)."
            exit 1
          fi
          echo "env=$ENV_FROM_INPUT" >> $GITHUB_OUTPUT
          echo "Workflow triggered for environment: $ENV_FROM_INPUT"

      - name: Check for Existing Tags
        id: check_tags
        run: |
          if [ "$(git tag | wc -l)" -eq 0 ]; then
            echo "has_no_tags=true" >> $GITHUB_OUTPUT
          else
            echo "has_no_tags=false" >> $GITHUB_OUTPUT
          fi

      - name: Create Initial Tag 0.0.0 if no tags exist
        if: steps.check_tags.outputs.has_no_tags == 'true'
        run: |
          echo "No tags found. Creating initial tag 0.0.0"
          git tag 0.0.0
          git push origin 0.0.0
          echo "Initial tag 0.0.0 created and pushed."
        continue-on-error: true

      - name: Get Next SemVer Version
        id: semver
        uses: ietf-tools/semver-action@v1
        with:
          token: ${{ secrets.GH_TOKEN }}
          branch: main
          noVersionBumpBehavior: patch
          fallbackTag: 0.0.0

      - name: Prepare Tag Components
        id: tag_components
        run: |
          SEMVER_VERSION="${{ steps.semver.outputs.nextStrict }}"
          BRANCH_NAME_FROM_INPUT="${{ inputs.pr_head_ref }}"
          if [ -z "$BRANCH_NAME_FROM_INPUT" ]; then
            echo "::error::Input pr_head_ref is empty. It's required for tag construction."
            exit 1
          fi
          BRANCH_NAME_SANITIZED=$(echo "$BRANCH_NAME_FROM_INPUT" | sed 's|/|_|g' | sed 's|[^a-zA-Z0-9_.-]||g')
          ENV_FOR_TAG="${{ steps.environment_info.outputs.env }}"
          CURRENT_DATE=$(date +'%Y%m%d')
          echo "semver=$SEMVER_VERSION" >> $GITHUB_OUTPUT
          echo "branch_name_sanitized=$BRANCH_NAME_SANITIZED" >> $GITHUB_OUTPUT
          echo "env_for_tag=$ENV_FOR_TAG" >> $GITHUB_OUTPUT
          echo "current_date=$CURRENT_DATE" >> $GITHUB_OUTPUT

      - name: Calculate Incremental Build Number (for dev/stg)
        id: build_number
        if: steps.tag_components.outputs.env_for_tag == 'dev' || steps.tag_components.outputs.env_for_tag == 'stg'
        run: |
          git fetch --tags --force
          ENV_TAG_PART="${{ steps.tag_components.outputs.env_for_tag }}"
          DATE_TAG_PART="${{ steps.tag_components.outputs.current_date }}"
          LAST_CI_NUM=$(git tag | grep -E "^[0-9]+\.[0-9]+\.[0-9]+-pipa\..*\.$ENV_TAG_PART\+$DATE_TAG_PART\.ci\.[0-9]+$" | sed -n "s/.*\.ci\.\([0-9]*\)$/\1/p" | sort -rn | head -n 1)
          if [ -z "$LAST_CI_NUM" ]; then NEXT_CI_NUM=1; else NEXT_CI_NUM=$((LAST_CI_NUM + 1)); fi
          echo "ci_num=$NEXT_CI_NUM" >> $GITHUB_OUTPUT

      - name: Construct Final (Full) Release Tag
        id: final_tag
        run: |
          SEMVER="${{ steps.tag_components.outputs.semver }}"
          ENV="${{ steps.tag_components.outputs.env_for_tag }}"
          if [ "$ENV" == "prod" ]; then
            FINAL_TAG_VALUE="v$SEMVER"
          else
            BRANCH_NAME="${{ steps.tag_components.outputs.branch_name_sanitized }}"
            CURRENT_DATE="${{ steps.tag_components.outputs.current_date }}"
            CI_NUM="${{ steps.build_number.outputs.ci_num }}"
            if [ -z "$CI_NUM" ]; then echo "::error::CI Number not calculated for $ENV"; exit 1; fi
            FINAL_TAG_VALUE="$SEMVER-pipa.$BRANCH_NAME.$ENV+$CURRENT_DATE.ci.$CI_NUM"
          fi
          echo "tag=$FINAL_TAG_VALUE" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.GH_TOKEN }}
          script: |
            const tagName = "${{ steps.final_tag.outputs.tag }}";
            const releaseName = `Release ${tagName}`;
            const isPrerelease = "${{ steps.tag_components.outputs.env_for_tag }}" !== "prod";
            await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tagName,
              name: releaseName,
              draft: false,
              prerelease: isPrerelease,
              generate_release_notes: true
            });

      - name: Construct Simplified Image Tag (for dev/stg)
        id: construct_simplified_tag
        if: (steps.tag_components.outputs.env_for_tag == 'dev' || steps.tag_components.outputs.env_for_tag == 'stg') && steps.build_number.outputs.ci_num != ''
        run: |
          SEMVER_BASE="${{ steps.tag_components.outputs.semver }}"
          BRANCH_NAME_ORIGINAL_SANE="${{ steps.tag_components.outputs.branch_name_sanitized }}"
          CI_NUMBER="${{ steps.build_number.outputs.ci_num }}"
          BRANCH_FOR_SIMPLIFIED_TAG=$(echo "$BRANCH_NAME_ORIGINAL_SANE" \
            | sed -E 's/^(feat|fix|chore|ci|docs|perf|refactor|revert|style|test)_//i' \
            | sed 's/_/-/g' \
            | sed 's|[^a-zA-Z0-9-]||g')
          if [ -z "$BRANCH_FOR_SIMPLIFIED_TAG" ]; then BRANCH_FOR_SIMPLIFIED_TAG="branch"; fi
          SIMPLIFIED_TAG_VALUE="$SEMVER_BASE-$BRANCH_FOR_SIMPLIFIED_TAG.$CI_NUMBER"
          echo "image_tag=$SIMPLIFIED_TAG_VALUE" >> $GITHUB_OUTPUT

  build:
    runs-on: ubuntu-latest
    needs: [tag_and_release]
    # Só executa se a tag simplificada foi gerada (ambientes dev/stg)
    if: needs.tag_and_release.outputs.simplified_image_tag != '' && (inputs.environment == 'dev' || inputs.environment == 'stg')
    outputs:
      docker_image_with_tag: ghcr.io/${{ github.repository_owner }}/${{ inputs.repository }}:${{ needs.tag_and_release.outputs.simplified_image_tag }}
      # Output do semver base para usar no AssemblyVersion se necessário, ou a tag completa para InformationalVersion
      image_tag_version: ${{ needs.tag_and_release.outputs.simplified_image_tag }}
      semver_base_version: ${{ needs.tag_and_release.outputs.semver_base }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        # Não precisa de fetch-depth: 0 aqui, pois não estamos calculando versão

      - name: Install .Net 6
        uses: actions/setup-dotnet@v2
        with:
          dotnet-version: "6.0.x"
          source-url: https://nuget.pkg.github.com/pipabingomaker # Assumindo que este é o nome da org/user
        env:
          NUGET_AUTH_TOKEN: ${{ secrets.GH_TOKEN }} # Usar o token enterprise para o feed privado

      - name: Set Version Environment Variable
        id: version_env
        run: |
          echo "IMAGE_TAG=${{ needs.tag_and_release.outputs.simplified_image_tag }}" >> $GITHUB_ENV
          echo "SEMVER_BASE=${{ needs.tag_and_release.outputs.semver_base }}" >> $GITHUB_ENV 
          echo "Informational version will be $IMAGE_TAG"
          echo "Assembly/Package version will be $SEMVER_BASE (or $IMAGE_TAG if preferred for packages)"

      - name: Restore
        run: dotnet restore

      - name: Build
        # Usar SEMVER_BASE para AssemblyVersion para manter o formato X.Y.Z
        # Usar IMAGE_TAG para InformationalVersion e Version (que afeta o nome do arquivo)
        run: |
          dotnet build -c Release --no-restore --no-incremental \
            /p:Version=${{ env.IMAGE_TAG }} \
            /p:AssemblyVersion=${{ env.SEMVER_BASE }} \
            /p:InformationalVersion=${{ env.IMAGE_TAG }}

      - name: Pack NuGet Packages
        # Usar IMAGE_TAG para PackageVersion, pois NuGet suporta SemVer 2.0 com metadados
        run: |
          dotnet pack src/BM.Account.Abstractions/BM.Account.Abstractions.csproj -c Release --no-build /p:PackageVersion=${{ env.IMAGE_TAG }}
          dotnet pack src/BM.Account.Client/BM.Account.Client.csproj -c Release --no-build /p:PackageVersion=${{ env.IMAGE_TAG }}
          dotnet pack src/BM.Account.Data/BM.Account.Data.csproj -c Release --no-build /p:PackageVersion=${{ env.IMAGE_TAG }}
          dotnet pack src/BM.Account.Events/BM.Account.Events.csproj -c Release --no-build /p:PackageVersion=${{ env.IMAGE_TAG }}
          dotnet pack src/BM.Account.Package/BM.Account.Packets.csproj -c Release --no-build /p:PackageVersion=${{ env.IMAGE_TAG }}

      - name: Push NuGet Packages
        env:
          NUGET_API_KEY: ${{ secrets.GH_TOKEN }} # Usar o mesmo token para push no GH Packages
          NUGET_SOURCE_URL: https://nuget.pkg.github.com/pipabingomaker
        run: |
          dotnet nuget push "src/BM.Account.Abstractions/bin/Release/BM.Account.Abstractions.${{ env.IMAGE_TAG }}.nupkg" --skip-duplicate -s "$NUGET_SOURCE_URL" -k "$NUGET_API_KEY"
          dotnet nuget push "src/BM.Account.Client/bin/Release/BM.Account.Client.${{ env.IMAGE_TAG }}.nupkg" --skip-duplicate -s "$NUGET_SOURCE_URL" -k "$NUGET_API_KEY"
          dotnet nuget push "src/BM.Account.Data/bin/Release/BM.Account.Data.${{ env.IMAGE_TAG }}.nupkg" --skip-duplicate -s "$NUGET_SOURCE_URL" -k "$NUGET_API_KEY"
          dotnet nuget push "src/BM.Account.Events/bin/Release/BM.Account.Events.${{ env.IMAGE_TAG }}.nupkg" --skip-duplicate -s "$NUGET_SOURCE_URL" -k "$NUGET_API_KEY"
          dotnet nuget push "src/BM.Account.Package/bin/Release/BM.Account.Packets.${{ env.IMAGE_TAG }}.nupkg" --skip-duplicate -s "$NUGET_SOURCE_URL" -k "$NUGET_API_KEY"

      - name: Publish Server binaries
        run: dotnet publish -c Release -o ./publish --no-build src/BM.Account.Host

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GH_TOKEN }} # Usar GH_TOKEN para ghcr.io

      - name: Build and Push Docker Image
        run: |
          DOCKER_IMAGE_NAME_FULL="ghcr.io/${{ github.repository_owner }}/${{ inputs.repository }}:${{ env.IMAGE_TAG }}"
          echo "Building Docker image: $DOCKER_IMAGE_NAME_FULL"
          docker build -f src/BM.Account.Host/Dockerfile -t "$DOCKER_IMAGE_NAME_FULL" ./publish
          docker push "$DOCKER_IMAGE_NAME_FULL"
          echo "Docker image pushed: $DOCKER_IMAGE_NAME_FULL"

  deploy-gitops:
    runs-on: ubuntu-latest
    needs: [build] # Depende do job de build
    # Só roda se o build rodou (implícito pelo if do build) e o ambiente é dev ou stg
    if: always() && needs.build.result == 'success' && (inputs.environment == 'dev' || inputs.environment == 'stg')
    steps:
      - name: Clone GitOps repository
        env:
          GITOPS_REPO_TOKEN: ${{ secrets.GH_TOKEN }}
          GITOPS_REPO_URL: "github.com/providerocp/gitops-apps.git"
          TARGET_GITOPS_DIR: "gitops_repo_checkout"
        run: |
          if [ -z "$GITOPS_REPO_TOKEN" ]; then echo "::error::Secret GH_TOKEN not set."; exit 1; fi
          git clone "https://x-access-token:$GITOPS_REPO_TOKEN@$GITOPS_REPO_URL" "$TARGET_GITOPS_DIR"
          cd "$TARGET_GITOPS_DIR"

      - name: Set Image Tag for GitOps
        id: set_image_env_var
        run: |
          IMAGE_TO_DEPLOY="${{ needs.build.outputs.docker_image_with_tag }}"
          echo "Image to deploy in GitOps: $IMAGE_TO_DEPLOY"
          # Extrair apenas a tag da imagem completa
          IMAGE_TAG_ONLY=$(echo "$IMAGE_TO_DEPLOY" | cut -d':' -f2)
          echo "IMAGE_TAG_FOR_GITOPS_UPDATE=$IMAGE_TAG_ONLY" >> $GITHUB_ENV

      - name: Update image tag in GitOps repo
        env:
          TARGET_GITOPS_DIR: "gitops_repo_checkout"
        run: |
          cd "$TARGET_GITOPS_DIR"
          APP_MANIFEST_FILE="apps/overlay/${{ inputs.environment }}/bm-${{ inputs.repository }}/app.yaml"
          if [ ! -f "$APP_MANIFEST_FILE" ]; then echo "::error::Manifest $APP_MANIFEST_FILE not found."; exit 1; fi
          # Usar a tag extraída (sem o nome da imagem/registry)
          sed -i -E "s#(${{ inputs.repository }}:)([^ ]+)#\1$IMAGE_TAG_FOR_GITOPS_UPDATE#" "$APP_MANIFEST_FILE"
          echo "Image tag updated in '$APP_MANIFEST_FILE'."
          git diff "$APP_MANIFEST_FILE"

      - name: Configure Git for GitOps repo
        env:
          TARGET_GITOPS_DIR: "gitops_repo_checkout"
        run: |
          cd "$TARGET_GITOPS_DIR"
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

      - name: Commit changes in GitOps repo
        env:
          TARGET_GITOPS_DIR: "gitops_repo_checkout"
        run: |
          cd "$TARGET_GITOPS_DIR"
          APP_MANIFEST_FILE_RELATIVE_PATH="apps/overlay/${{ inputs.environment }}/bm-${{ inputs.repository }}/app.yaml"
          git add "$APP_MANIFEST_FILE_RELATIVE_PATH"
          if git diff --staged --quiet; then
            echo "No changes to commit in GitOps repo."
          else
            COMMIT_MSG="Update image for bm-${{ inputs.repository }} to $IMAGE_TAG_FOR_GITOPS_UPDATE in ${{ inputs.environment }}"
            git commit -m "$COMMIT_MSG"
          fi

      - name: Push changes to GitOps repo
        env:
          TARGET_GITOPS_DIR: "gitops_repo_checkout"
        run: |
          cd "$TARGET_GITOPS_DIR"
          # Check if there are new commits to push
          if [ "$(git rev-list --count @{u}..HEAD)" -gt 0 ]; then
             echo "Pushing changes to GitOps repository..."
             git push
          else
             echo "No new commits to push to GitOps repository."
          fi

